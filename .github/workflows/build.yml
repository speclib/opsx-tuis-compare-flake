name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Show flake outputs
        run: nix flake show --json | head -c 4000

      - name: Run the gate
        run: nix flake check -L

      # packages.default does not exist until milestone 06. Skipping with a
      # notice keeps the first red build a real one.
      - name: Build the combined environment
        run: |
          if nix eval --raw '.#packages.x86_64-linux.default.name' >/dev/null 2>&1; then
            nix build -L '.#default'
            echo "commands exposed:"
            ls result/bin
          else
            echo "::notice::packages.default does not exist yet, skipping"
          fi
